io: &paths
  subject_id: &id control_01
  data_path: data/new_data/CALIPR_HC/CALIPR_qT2_SPIRALlongFOVmoreUS_20240808.user_rrdf_20241011_093250_calipr_recon_all.nii
  mask_path: data/new_data/CALIPR_HC/CALIPR_qT2_SPIRALlongFOVmoreUS_20240808.user_rrdf_20241011_093250_calipr_recon_all_mask.nii.gz # if no mask, set to Null or False. However, mask is recommended for better performance
  # mask_path: Null
  save_path: results/rician/rician_
  descrip: assume rician noise  # add descriptive text to header (max 80 chars)
  save_model_path: &model_path models/rician.h5

fitting:
  number_of_echoes: &num_te 80 # if less than the total number of echoes in the data, the first n echoes will be used
  half_echoes: False # if True, the even number of echoes will be used (0,2,4,6,...)
  first_echo_time: &1st_te 0.00431
  echo_spacing: &delta_te 0.00431
  number_of_pools: &num_pool 3
  range_t2_my: &t2s_my [0.01, 0.03]
  range_t2_ie: &t2s_ie [0.09, 0.15]
  range_t2_fr: &t2s_fr [0.5, 1]
  mwf_cutoff: &my_t2_cutoff 0.03

preprocessing:
  mask_threshold: 0.5
  normalization: &normalization True # if True, loss function should be categorical_crossentropy (mse for False)
  scaling_quantile: 0.99 # to calculate scaling factor and exclude outliers

model: &structure
  encoder:
    name: encoder model
    input_shape: *num_te
    latent_shape: *num_pool
    range_t2_my: *t2s_my
    range_t2_ie: *t2s_ie
    range_t2_fr: *t2s_fr

    # encoder architecture
    base_nn_t2s:
      name: mlp # selections = [mlp, resnet]

    base_nn_amps:
      name: mlp # selections = [mlp, resnet]

    base_mlp_t2:
      hidden_layers: [256, 128]
      num_classes: 1
      activation: sigmoid
      activation_last_layer: sigmoid
      l1_reg: 0

    base_mlp_amps:
      hidden_layers: [256, 256]
      num_classes: *num_pool
      activation: sigmoid
      activation_last_layer: softmax
      l1_reg: 0.1

    base_resnet_t2: 
      hidden_layers_head: [128]
      num_res_blocks: 2
      res_block_size: [256, 256]
      hidden_layers_tail: [128]
      num_classes: 1
      activation: sigmoid
      activation_last_layer: sigmoid
      l1_reg: 0

    base_resnet_amps: 
      hidden_layers_head: [128]
      num_res_blocks: 2
      res_block_size: [256, 256]
      hidden_layers_tail: [128]
      num_classes: *num_pool
      activation: sigmoid
      activation_last_layer: softmax
      l1_reg: 0
    
  decoder:
    name: decoder_exp
    num_classes: *num_pool
    nte: *num_te
    first_te: *1st_te
    delta_te: *delta_te
    snr_range: Null # [50, 300]
    normalization: *normalization

pretrain:
  pretrain_model: True
  number_of_echoes: *num_te 
  first_echo_time: *1st_te
  echo_spacing: *delta_te
  number_of_pools: *num_pool
  number_of_samples: 200000
  t2_ranges: [*t2s_my, *t2s_ie, *t2s_fr]
  amplitude_ranges: [[0,0.3],[0,1],[0,1]] # for white and grey matter only, csf is simulated independently
  snr_range: &snr_range [30, 60]
  csf_sim: True # if True, simulate CSF independently
  csf_n_samples: 50000
  loss: {'t2s': 'categorical_crossentropy', 'amps': 'categorical_crossentropy', 'fitted_signals': 'rician_nll_loss'}
  loss_rician_sigma: 0.08
  loss_weights: {'t2s': 0, 'amps': 50, 'fitted_signals': 0.1}
  metrics: {'t2s': 'mae', 'amps': 'mae', 'fitted_signals': 'mae'}
  epochs: 20
  learning_rate: 0.001
  batch_size: 512
  verbose: 1
  shuffle: True

training:
  # model compile
  name: *id
  model_structure: *structure 
  loss: {'fitted_signals': 'rician_nll_loss'} # categorical_crossentropy for normalization=True only
  loss_rician_sigma: 0.08
  optimizer:
    name: adamax
    learning_rate: 0.0001
    clipnorm: Null
    clipvalue: Null
  metric: mae

  # model training
  shuffle: True
  epochs: 100
  batch_size: 512
  verbose: 1 

  # callbacks
  TensorBoard_log_path: logs
  TensorBoard_hist_freq: 1
  EarlyStopping_monitor: loss
  EarlyStopping_patience: 15
  ReduceLROnPlateau_monitor: loss
  ReduceLROnPlateau_factor: 0.5
  ReduceLROnPlateau_patience: 3
  Checkpoint_monitor: loss
  save_best_only: True

  # paths
  io: *paths
  log_path: logs/training.log
  save_model_path: *model_path


postprocessing:
  mwf_cutoff: *my_t2_cutoff
  save_residuals: False

